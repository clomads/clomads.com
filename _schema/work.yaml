$id: work
title: Work
description: >
  One piece of work in the archive: a client job, a personal project, a concept, or a collection
  (logos, app concepts). One note each, in the folder of its section; half-finished dumps start in Inbox/.
  Nothing leaves the vault until publish is true.
type: object
required: [type, title]
properties:
  type:
    const: work
  title:
    type: string
    minLength: 1
    description: Title as it should read on the site.
  section:
    type: string
    enum: [work, personal]
    description: >
      Site section, by URL slug: work (client jobs, VDBX, logo and app collections) or personal (personal
      projects and concepts). Titles are in x-sections below. Required to publish; a note in Inbox/ can
      leave it blank until it is sorted.
  year:
    type: integer
    minimum: 1990
    maximum: 2100
    description: Year the work started (or the only year).
  until:
    type: integer
    minimum: 1990
    maximum: 2100
    description: Last year, for work that spanned several. Leave blank for a single year; status ongoing shows "2020–".
  role:
    type: string
    description: What you did, e.g. "Lead UI Designer / Art Director".
  client:
    type: string
    description: Who it was for. Blank for personal work.
  status:
    type: string
    enum: [concept, prototype, ongoing, complete, shelved]
    description: >
      concept (never built) → prototype → ongoing (still being worked on) → complete; shelved for things
      paused indefinitely. Optional; most archive pieces are simply complete.
  featured:
    type: boolean
    description: true puts it in the Featured cards on the home page.
  order:
    type: integer
    description: >
      Position in its section's menu, lower first. Without one, newest year first (a year counts as
      3000 minus the year, so 2014 sits at 986). Voidbox Industries uses 1 to lead Work, Logos 5000 to close it.
  description:
    type: string
    description: One line for the card and page meta.
  hero:
    type: string
    description: Cover image, a filename in X - Media/Attachments (or a path relative to the note).
  links:
    type: array
    description: >
      External links, shown as buttons named by host (GitHub, YouTube, Printables…). Bare URLs, or
      {url, label} to set the label.
    items:
      anyOf:
        - { type: string }
        - { type: object, required: [url], properties: { url: { type: string }, label: { type: string } } }
  files:
    type: array
    description: Downloads, filenames from X - Media/Attachments. Bare names or {path, label}.
    items:
      anyOf:
        - { type: string }
        - { type: object, required: [path], properties: { path: { type: string }, label: { type: string } } }
  tags:
    type: array
    items: { type: string }
    description: Free-form, e.g. logo, web, video, pcb, 3d-print.
  publish:
    type: boolean
    description: true puts this on clomads.com.
  redirect_from:
    type: array
    items: { type: string }
    description: Old site paths this note replaces, without leading slash.
    x-hidden: true
  aliases:
    type: array
    items: { type: string }
    x-hidden: true
x-sections:
  work: Work
  personal: Personal
x-template:
  type: work
  publish: false
