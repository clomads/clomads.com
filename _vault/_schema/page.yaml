$id: page
title: Page
description: >
  A site page that is not a piece of work: the home page (Pages/Home), About, the not-found page (Pages/404).
  Lives in Pages/.
type: object
required: [type, title]
properties:
  type:
    const: page
  title:
    type: string
    minLength: 1
  description:
    type: string
  hero:
    type: string
  order:
    type: integer
  publish:
    type: boolean
  redirect_from:
    type: array
    items: { type: string }
    description: Old site paths this page replaces, without leading slash.
  tags:
    type: array
    items: { type: string }
